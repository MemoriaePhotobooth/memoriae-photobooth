name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build all apps
        run: |
          DEFINES="--dart-define=MAPTILER_KEY=${{ secrets.MAPTILER_KEY }} --dart-define=LOCATIONIQ_KEY=${{ secrets.LOCATIONIQ_KEY }}"

          flutter build web -t lib/main_user.dart --release --base-href "/memoriae-photobooth/" $DEFINES
          mkdir -p site && cp -r build/web/. site/

          flutter build web -t lib/main_admin.dart --release --base-href "/memoriae-photobooth/admin/" $DEFINES
          mkdir -p site/admin && cp -r build/web/. site/admin/

          flutter build web -t lib/main_staff.dart --release --base-href "/memoriae-photobooth/staff/" $DEFINES
          mkdir -p site/staff && cp -r build/web/. site/staff/

          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4