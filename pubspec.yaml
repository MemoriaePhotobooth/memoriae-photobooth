name: memoriae_photobooth
description: Memoriae Photobooth — combined Admin, Staff, and User apps (bookings + receipts backed by Firebase Firestore/Storage)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  http: ^1.2.2
  firebase_storage: ^12.3.7
  firebase_auth: ^5.3.1
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  pdf: ^3.11.1
  printing: ^5.13.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  qr_flutter: ^4.1.0
  gal: ^2.3.1
  share_plus: ^10.1.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/